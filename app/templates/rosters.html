{% extends "base.html" %}
{% block content %}
<section class="page-title compact"><div><p class="eyebrow">EVERY FRANCHISE, ONE VIEW</p><h1>League Rosters</h1><p>Ownership follows MFL. Strength and needs use the same league-adjusted board.</p></div>{% include "league_select.html" %}</section>
<div id="roster-summary" class="budget-grid"><article class="card">Loading rosters…</article></div>
<section class="panel flush"><div class="panel-head"><h2>Roster table</h2><input id="roster-search" type="search" placeholder="Filter franchise or player…"></div><div class="table-wrap"><table><thead><tr><th><button onclick="sortRoster('franchise_name')">Franchise ↕</button></th><th><button onclick="sortRoster('player_name')">Player ↕</button></th><th><button onclick="sortRoster('position')">Pos ↕</button></th><th><button onclick="sortRoster('nfl_team')">NFL ↕</button></th><th><button onclick="sortRoster('status')">Status ↕</button></th><th><button onclick="sortRoster('salary')">Salary ↕</button></th><th class="roster-keeper-column">Keeper</th><th><button onclick="sortRoster('league_adjusted_rank')">League rank ↕</button></th></tr><tr class="column-filters"><th><input id="roster-owner-filter" aria-label="Filter franchise column"></th><th><input id="roster-player-filter" aria-label="Filter player column"></th><th><input id="roster-position-filter" aria-label="Filter position column"></th><th><input id="roster-team-filter" aria-label="Filter NFL team column"></th><th><input id="roster-status-filter" aria-label="Filter status column"></th><th></th><th class="roster-keeper-column"><select id="roster-keeper-filter" aria-label="Filter keeper column"><option value="">All</option><option value="true">Keepers</option><option value="false">Non-keepers</option></select></th><th></th></tr></thead><tbody id="roster-body"></tbody></table></div></section>
{% endblock %}
{% block scripts %}<script>window.SELECTED_LEAGUE_ID={{ selected_league_id|tojson }};window.IS_ROSTER_ADMIN={{ is_admin|tojson }};initRosters()</script>{% endblock %}
